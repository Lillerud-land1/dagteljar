<title>Dagteljar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: avrivingskalender. Kvar nedteljing er ei kalenderside med farga topp (eller bilete),
   perforering og eit stort tal. Neste hending står stort øvst, resten i eit rutenett under. */
:root{
  --ground:#E5E8ED;
  --paper:#FFFFFF;
  --field:#F3F5F8;
  --ink:#161B25;
  --ink-2:#586172;
  --line:#D2D7DF;
  --raud:#D21F28;
  --focus:#2450B5;
  --c-rogn:#DE6816;
  --c-raud:#C8232B;
  --c-gran:#1D6A46;
  --c-fjord:#2450B5;
  --c-lyng:#7A3DA6;
  --c-natt:#262C3A;
  --on-band:#FFFFFF;
  --shadow:0 1px 1px rgba(22,27,37,.06),0 10px 24px -14px rgba(22,27,37,.38);
  --shadow-hi:0 1px 1px rgba(22,27,37,.08),0 16px 32px -14px rgba(22,27,37,.45);
  --backdrop:rgba(14,18,27,.52);
  --f-num:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-page:6px;
  --r-sheet:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1117; --paper:#1A1F29; --field:#11151D; --ink:#ECEEF2; --ink-2:#9AA3B3;
    --line:#2C3341; --raud:#FF5A60; --focus:#86A8FF; --c-natt:#3B4357;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.85);
    --shadow-hi:0 1px 0 rgba(0,0,0,.4),0 18px 36px -16px rgba(0,0,0,.95);
    --backdrop:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1117; --paper:#1A1F29; --field:#11151D; --ink:#ECEEF2; --ink-2:#9AA3B3;
  --line:#2C3341; --raud:#FF5A60; --focus:#86A8FF; --c-natt:#3B4357;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.85);
  --shadow-hi:0 1px 0 rgba(0,0,0,.4),0 18px 36px -16px rgba(0,0,0,.95);
  --backdrop:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{display:block}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:30px}

/* Topp */
.top{display:flex;align-items:center;gap:10px}
.top .brand{margin-left:4px}
.mini{flex:none;width:50px;display:flex;flex-direction:column;border-radius:5px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);text-align:center}
.mini-m{background:var(--band,var(--raud));color:var(--on-band);font-size:11px;font-weight:700;letter-spacing:.03em;line-height:1;padding:4px 0 3px;min-height:18px}
.mini-d{display:grid;place-items:center;min-height:34px;font-family:var(--f-num);font-weight:800;font-size:28px;line-height:1;padding:2px 0 4px;font-variant-numeric:tabular-nums}
.mini-d svg{width:22px;height:22px}
.top .mini{--band:var(--raud)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:var(--f-num);font-weight:800;font-size:36px;line-height:.92;letter-spacing:.004em}
.brand p{margin:4px 0 0;color:var(--ink-2);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .1s}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-danger{color:var(--raud)}
.btn-danger.armed{background:var(--raud);border-color:var(--raud);color:#fff}
.btn:focus-within:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* Seksjonar */
.label{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink-2)}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:baseline;gap:8px}
.group h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.count{font-size:15px;color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}

/* Kalenderside */
.page{position:relative;display:flex;flex-direction:column;width:100%;padding:0;border:0;border-radius:var(--r-page);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:center;transition:box-shadow .2s,transform .12s}
.page:hover{box-shadow:var(--shadow-hi)}
.page:active{transform:scale(.985)}
.band{position:relative;display:flex;align-items:flex-end;min-height:58px;padding:10px 12px;background:var(--band,var(--c-rogn));color:var(--on-band);text-align:left;overflow:hidden}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.has-photo .band{aspect-ratio:16/11;min-height:0}
.has-photo .band::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,16,.74),rgba(8,10,16,0) 60%)}
.band-title{position:relative;z-index:1;font-weight:700;font-size:15px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.perf{flex:none;height:9px;background:radial-gradient(circle at 5px 4.5px,var(--ground) 2px,transparent 2.6px) 1px 0/10px 9px repeat-x}
.body{container-type:inline-size;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px 15px;min-width:0}
.num{--k:46;font-family:var(--f-num);font-weight:800;line-height:.88;font-size:64px;font-size:calc(var(--k)*1cqi);font-variant-numeric:tabular-nums;white-space:nowrap}
.num.l1{--k:60}.num.l2{--k:56}.num.l3{--k:47}.num.l4{--k:44}.num.l5{--k:40}.num.l6{--k:34}
.soon .num{color:var(--raud)}
.ended .num{color:var(--ink-2)}
.unit{font-weight:600;font-size:14px}
.when{font-size:13px;color:var(--ink-2);text-wrap:balance}
.extra{font-size:12.5px;font-weight:700;color:var(--raud)}

.page.big .band{min-height:120px;padding:16px 18px}
.page.big.has-photo .band{aspect-ratio:16/10;min-height:0}
.page.big .band-title{font-size:23px}
.page.big .body{padding:8px 16px 22px;gap:5px}
.page.big .num{font-size:min(calc(var(--k)*1.05cqi),170px)}
.page.big .unit{font-size:18px}
.page.big .when{font-size:15px}
.page.big .extra{font-size:14px}
@media (min-width:720px){
  .page.big{display:grid;grid-template-columns:minmax(0,1.15fr) 9px minmax(0,1fr);min-height:320px}
  .page.big .band,.page.big.has-photo .band{aspect-ratio:auto;min-height:100%}
  .page.big .perf{height:auto;background:radial-gradient(circle at 4.5px 5px,var(--ground) 2px,transparent 2.6px) 0 1px/9px 10px repeat-y}
  .page.big .body{justify-content:center;padding:28px 24px}
}

/* Tom side og lasting */
.blank{display:flex;flex-direction:column;border-radius:var(--r-page);background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.blank .band{--band:var(--line);min-height:44px}
.blank-in{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 20px 22px}
.blank h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.blank p{margin:0;color:var(--ink-2);max-width:52ch}

/* «Ny»-arket: tom nedteljing eller eit forslag. Forslaga er små kalendersider med biletet øvst. */
.pick{display:flex;flex-direction:column;gap:16px;padding:18px 20px 24px}
.pick-blank{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.pick-blank:hover{background:var(--field)}
.pick-plus{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper)}
.pick-plus svg{width:22px;height:22px}
.pick-txt{display:flex;flex-direction:column;min-width:0}
.pick-t{font-weight:700;font-size:16px;line-height:1.25}
.pick-s{font-size:14px;color:var(--ink-2)}
.pick h3{margin:8px 0 -4px;font-size:18px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;padding:0;border:0;border-radius:var(--r-page);background:var(--field);color:var(--ink);overflow:hidden;cursor:pointer;text-align:left;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile-art{position:relative;display:block;aspect-ratio:16/10;background:var(--band)}
.tile-art svg{width:100%;height:100%}
.tile .perf{--ground:var(--paper)}
.tile-txt{display:flex;flex-direction:column;gap:1px;padding:3px 12px 12px}
.tile-t{font-weight:700;font-size:15.5px;line-height:1.25}
.tile-s{font-size:13.5px;color:var(--ink-2)}
.tile.done .tile-art{opacity:.5}

#main{display:flex;flex-direction:column;gap:34px}
.foot{margin:0;font-size:13.5px;color:var(--ink-2);max-width:62ch}

/* Illustrasjonar */
.has-photo .band:has(.art)::after,.d-media:has(.art)::after{background:linear-gradient(to top,rgba(8,10,16,.6),rgba(8,10,16,0) 45%)}
.art{position:absolute;inset:0;display:block}
.art svg{display:block;width:100%;height:100%}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.art-opt{position:relative;aspect-ratio:16/10;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--field);color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer}
.art-opt svg,.art-opt img{display:block;width:100%;height:100%;object-fit:cover}
.art-opt.none{border:1.5px dashed var(--line);background:transparent}
.art-opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--ink)}

/* Konto */
.icon-btn{position:relative;display:grid;place-items:center;flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer}
.icon-btn svg{width:21px;height:21px}
.icon-btn.on::after{content:"";position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--c-gran);box-shadow:0 0 0 2px var(--ground)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}
.strip p{margin:0;flex:1 1 220px;font-size:15px}
.strip .btn{min-height:40px}
.acct{display:flex;flex-direction:column;gap:16px;padding:18px 20px 0}
.acct p{margin:0}
.muted{color:var(--ink-2)}

/* Ark (detaljar og skjema) */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--backdrop);padding-top:max(24px,env(safe-area-inset-top,0px))}
.sheet{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--paper);color:var(--ink);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet:focus{outline:none}
@media (min-width:700px){
  .layer{align-items:center;padding:32px}
  .sheet{border-radius:var(--r-sheet);max-height:calc(100vh - 64px);padding-bottom:0}
}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:12px;right:12px;z-index:4;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:rgba(8,10,16,.45);color:#fff;cursor:pointer}
.x svg{width:20px;height:20px}
.x.plain{position:static;background:var(--field);color:var(--ink);flex:none}

.d-media{position:relative;display:flex;align-items:flex-end;min-height:150px;padding:56px 22px 20px;background:var(--band);color:var(--on-band);overflow:hidden}
.d-media.has-photo{height:clamp(220px,64vw,360px)}
.d-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-media.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,16,.75),rgba(8,10,16,0) 55%)}
.d-title{position:relative;z-index:1;margin:0;font-size:28px;font-weight:700;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.d-count{container-type:inline-size;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 20px 6px;text-align:center}
.d-count .num{font-size:min(calc(var(--k)*1cqi),180px)}
.d-count .unit{font-size:18px}
.d-count .extra{font-size:15px}
.tick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 20px 18px}
.tick div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border-radius:10px;background:var(--field)}
.tick b{font-family:var(--f-num);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tick span{font-size:12.5px;color:var(--ink-2)}
.today-msg{margin:0;padding:4px 20px 16px;text-align:center;font-weight:600;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:0;padding:16px 20px 6px;border-top:1px solid var(--line)}
.facts dt{color:var(--ink-2);font-size:14.5px}
.facts dd{margin:0;font-size:15px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px 22px}
.actions .btn{flex:1 1 140px}

/* Skjema */
.form{display:flex;flex-direction:column;gap:18px;padding:18px 20px 0}
.form-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.form-head h2{margin:0;font-size:23px;font-weight:700}
.field{display:flex;flex-direction:column;gap:7px;min-width:0;margin:0;padding:0;border:0}
.field > span,.field legend{padding:0;font-size:14px;font-weight:600;color:var(--ink-2)}
.field legend{margin-bottom:7px}
.field em{font-style:normal;font-weight:400}
.input{width:100%;min-width:0;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;font-size:16px}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 28%,transparent)}
input[type="date"].input,input[type="time"].input{-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end;gap:12px}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.seg button{flex:1;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14.5px;font-weight:600;line-height:1.2;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.every{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.every .input{width:70px;text-align:center}
.hint{margin:0;font-size:13.5px;color:var(--ink-2)}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{position:relative;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:38px;height:38px;border-radius:50%;background:var(--band)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.sw input:focus-visible + span{outline:3px solid var(--focus);outline-offset:5px}
.photo-pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.thumb{width:88px;height:66px;border-radius:8px;object-fit:cover;background:var(--field)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.rule-note{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border-radius:10px;background:var(--field);font-size:15px}
.linkbtn{padding:0;border:0;background:none;color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.form-err{margin:0;color:var(--raud);font-size:14.5px;font-weight:600}
.form-err:empty{display:none}
.form-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;margin:0 -20px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
@media (min-width:700px){.form-foot{padding-bottom:16px}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .sheet{animation:none}
  .page,.btn,.toast,.tile{transition:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="mini" aria-hidden="true"><span class="mini-m" id="todayM">okt.</span><span class="mini-d" id="todayD">27</span></div>
    <div class="brand">
      <h1>Dagteljar</h1>
      <p id="todayText">&nbsp;</p>
    </div>
    <button class="icon-btn" id="kontoBtn" type="button" aria-label="Konto og synk" hidden></button>
    <button class="btn btn-primary" id="addBtn" type="button" aria-label="Ny nedteljing" hidden></button>
  </header>
  <main id="main"></main>
  <p class="foot" id="foot"></p>
</div>
<div class="layer" id="layer" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'nn';

  const KEY = 'dagteljar.v1';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DAYS = ['sundag', 'måndag', 'tysdag', 'onsdag', 'torsdag', 'fredag', 'laurdag'];
  const MONTHS = ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'];
  const MON_S = ['jan.', 'feb.', 'mars', 'apr.', 'mai', 'juni', 'juli', 'aug.', 'sep.', 'okt.', 'nov.', 'des.'];
  const nf = new Intl.NumberFormat('nb-NO');
  const fmt = n => nf.format(n);
  const pl = (n, one, many) => (n === 1 ? one : many);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const og = a => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' og ' + a[a.length - 1]);

  const COLORS = ['rogn', 'raud', 'gran', 'fjord', 'lyng', 'natt'];
  const COLOR_NAMES = { rogn: 'Rogn', raud: 'Raud', gran: 'Gran', fjord: 'Fjord', lyng: 'Lyng', natt: 'Natt' };
  const UNIT_NAMES = { day: 'dag', week: 'veke', month: 'månad', year: 'år' };

  const TEMPLATES = [

  function readLocal() {

  async function api(path, opts = {}) {

  function render() {
    const now = new Date(), today = dateOnly(now);
    $('#todayM').textContent = MON_S[today.getMonth()];
    $('#todayD').textContent = today.getDate();
    $('#todayText').textContent = `${cap(DAYS[today.getDay()])} ${today.getDate()}. ${MONTHS[today.getMonth()]}, veke ${isoWeek(today)}`;
    const add = $('#addBtn');
    add.hidden = !S.canWrite || S.loading;
    if (!add.innerHTML) add.innerHTML = ICON.plus + '<span>Ny</span>';
    const konto = $('#kontoBtn');
    konto.hidden = !CLOUD_OK;
    if (!konto.innerHTML) konto.innerHTML = ICON.user;
    konto.classList.toggle('on', !!S.acc);
    konto.setAttribute('aria-label', S.acc ? `Konto: innlogga som ${S.acc.namn}` : 'Logg inn for å synke');

    const rows = S.events.map(ev => ({ ev, st: status(ev, now) }));
    const downs = rows.filter(r => r.st.phase !== 'since').sort((a, b) => a.st.days - b.st.days || a.ev.title.localeCompare(b.ev.title, 'nb'));
    const ups = rows.filter(r => r.st.phase === 'since').sort((a, b) => (a.st.ended ? 1 : 0) - (b.st.ended ? 1 : 0) || (a.st.ended ? a.st.days - b.st.days : b.st.days - a.st.days));
    const hero = downs[0] || ups.find(r => !r.st.ended) || null;

    let html = '';
    if (CLOUD_OK && !S.acc && !S.loading) {
      html += `<div class="strip"><p>Vil du sjå nedteljingane på både PC-en og telefonen? Logg inn, så blir dei synka.</p><button type="button" class="btn" data-login>${ICON.user}<span>Logg inn</span></button></div>`;
    }
    if (S.loading) {
      html += `<section><div class="blank"><span class="band"></span><span class="perf" aria-hidden="true"></span><div class="blank-in"><h2>Hentar nedteljingane dine</h2><p>Det tek berre eit augeblikk.</p></div></div></section>`;
    } else if (!hero) {
      html += `<section><div class="blank"><span class="band"></span><span class="perf" aria-hidden="true"></span><div class="blank-in">`
        + `<h2>Ingen nedteljingar enno</h2><p>Legg til ein bursdag, jula eller dagen hunden kom i hus. Under «Ny» finn du forslag med ferdige bilete.</p>`
        + (S.canWrite ? `<button type="button" class="btn btn-primary" data-new>${ICON.plus}<span>Ny nedteljing</span></button>` : '')
        + `</div></div></section>`;
    } else {
      html += `<section aria-label="Neste"><p class="label">${hero.st.phase === 'since' ? 'Tel opp' : 'Neste'}</p>${pageHTML(hero.ev, hero.st, now, true)}</section>`;
    }
    const laterDown = downs.filter(r => r !== hero);
    if (laterDown.length) html += groupHTML('Seinare', laterDown, now);
    const restUp = ups.filter(r => r !== hero);
    if (restUp.length) html += groupHTML('Tel opp', restUp, now);

    if (html !== lastMain) { main.innerHTML = html; lastMain = html; }

    $('#foot').textContent = S.loading ? ''
      : !S.canWrite ? 'Du kan sjå denne kalenderen, men ikkje endre han.'
      : S.mode === 'db' ? 'Nedteljingane er lagra på claude.ai, så du ser dei same på telefonen og PC-en.'
      : S.mode === 'cloud' ? `Innlogga som «${S.acc.namn}». ${syncText()}`
      : S.memoryOnly ? 'Denne nettlesaren lagrar ikkje data her, så nedteljingane forsvinn når du lukkar sida.'
      : 'Nedteljingane er lagra på denne eininga.';
  }

  // ---------- Ark ----------
  function showLayer(html, kind) {
    if (layer.hidden) S.lastFocus = document.activeElement;

    layer.hidden = false;

  }
  function closeLayer() {
    stopTick();
    if (F && F.ownPreview) URL.revokeObjectURL(F.ownPreview);
    F = null;
    A = null;
    S.detailId = null;

  function tickValues(ev, st, now) {
    let ms = st.phase === 'since' ? now - withTime(st.start, ev.time) : withTime(st.occ, ev.time) - now;
    const s = Math.floor(Math.max(0, ms) / 1000);
    return { ms, v: [Math.floor(s / 86400), Math.floor((s % 86400) / 3600), Math.floor((s % 3600) / 60), s % 60] };
  }
  const TICK_NAMES = [['dag', 'dagar'], ['time', 'timar'], ['minutt', 'minutt'], ['sekund', 'sekund']];

  function detailInner(ev, now) {
    const st = status(ev, now), c = cardData(ev, st, now), t = st.today, ph = photoHTML(ev.photo, false);
    const facts = [];
    const timeTxt = ev.time ? ` kl. ${ev.time}` : '';
    if (st.phase === 'since') {
      facts.push([st.ended ? 'Datoen var' : 'Starta', cap(dateLabel(st.start, t, true)) + timeTxt]);
      if (st.days > 0) facts.push(['Tid sidan', ymdLong(ymdDiff(st.start, t))]);
      if (st.days >= 14) {
        const w = Math.floor(st.days / 7), r = st.days % 7;
        facts.push(['I veker', `${fmt(w)} ${pl(w, 'veke', 'veker')}${r ? ` og ${r} ${pl(r, 'dag', 'dagar')}` : ''}`]);
      }
      if (!st.ended) {
        const ms = nextMilestone(st.days);
        facts.push(['Neste milepæl', `${fmt(ms)} dagar, ${dateLabel(addDays(st.start, ms), t)} (${inText(ms - st.days)})`]);
        let ann = firstOcc({ date: ymd(st.start), repeat: { unit: 'year', every: 1 } }, t);
        if (dayNum(ann) === dayNum(st.start)) ann = addMonths(st.start, 12);
        const n = ann.getFullYear() - st.start.getFullYear(), aD = dayNum(ann) - dayNum(t);
        facts.push([aD === 0 ? 'Årsdag i dag' : 'Neste årsdag', `${n} år, ${dateLabel(ann, t)}${aD ? ` (${inText(aD)})` : ''}`]);
      }
    } else {
      facts.push(['Dato', cap(dateLabel(st.occ, t, true)) + timeTxt]);
      if (repeats(ev)) {
        facts.push(['Gjentek seg', repeatText(ev)]);
        const after = firstOcc(ev, addDays(st.occ, 1));
        if (after) facts.push(['Gongen etter', cap(dateLabel(after, t, true))]);
      }
      if (ev.showAge) facts.push([st.phase === 'today' ? 'Fyller i dag' : 'Fyller', `${ageAt(ev, st.occ)} år`]);
    }
    const tv = tickValues(ev, st, now);
    const showTick = !(st.phase === 'today' && tv.ms <= 0);
    const L = Math.min(6, Math.max(1, c.num.length));
    const soon = st.phase === 'today' || (st.phase === 'down' && st.days <= 7);
    const unitLine = st.phase === 'today' ? 'er dagen' : `${c.unit} ${st.phase === 'since' ? '' : esc(ev.title)}`.trim();
    return `<button type="button" class="x" data-close aria-label="Lukk">${ICON.x}</button>`
      + `<div class="d-media${ph ? ' has-photo' : ''}" style="--band:var(--c-${ev.color})">${ph}<h2 class="d-title" id="sheetTitle">${esc(ev.title)}</h2></div>`
      + `<div class="d-count${soon ? ' soon' : ''}${st.ended ? ' ended' : ''}"><span class="num l${L}">${esc(c.num)}</span><span class="unit">${unitLine}</span>${c.extra ? `<span class="extra">${esc(c.extra)}</span>` : ''}</div>`
      + (showTick
        ? `<div class="tick" aria-hidden="true">${tv.v.map((x, i) => `<div><b data-t="${i}">${fmt(x)}</b><span data-tl="${i}">${TICK_NAMES[i][x === 1 ? 0 : 1]}</span></div>`).join('')}</div>`
        : `<p class="today-msg">I dag er dagen. Kos deg!</p>`)
      + `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`
      + (S.canWrite ? `<div class="actions"><button type="button" class="btn" data-edit="${esc(ev.id)}">${ICON.edit}<span>Endre</span></button><button type="button" class="btn btn-danger" data-del="${esc(ev.id)}">${ICON.trash}<span>Slett</span></button></div>` : '<div style="height:16px"></div>');
  }
  const detailSig = (ev, now) => { const st = status(ev, now); return st.phase + st.days + JSON.stringify(ev); };

  function openDetail(id) {
    const ev = S.events.find(e => e.id === id);
    if (!ev) return;
    const now = new Date();
    const sheet = showLayer(detailInner(ev, now), 'detail');
    sheet.dataset.sig = detailSig(ev, now);
    S.detailId = id;
    startTick();
    const st = status(ev, now);
    if (st.phase === 'today' || (st.phase === 'since' && !st.ended && /år i dag/.test(cardData(ev, st, now).extra))) confetti($('.d-media', sheet));
  }
  function refreshDetail() {
    const sheet = $('.sheet.detail', layer);
    if (!sheet) return;
    const ev = S.events.find(e => e.id === S.detailId);
    if (!ev) { closeLayer(); return; }
    const now = new Date();
    const sig = detailSig(ev, now);
    if (sheet.dataset.sig === sig) return;
    const top = sheet.scrollTop;
    sheet.innerHTML = detailInner(ev, now);
    sheet.dataset.sig = sig;
    sheet.scrollTop = top;
  }
  let tickTimer = 0;
  function startTick() { stopTick(); tickTimer = setInterval(updateTick, 1000); }
  function stopTick() { clearInterval(tickTimer); tickTimer = 0; }
  function updateTick() {
    const sheet = $('.sheet.detail', layer);
    const ev = S.events.find(e => e.id === S.detailId);
    if (!sheet || !ev) return;
    const now = new Date();
    if (sheet.dataset.sig !== detailSig(ev, now)) { refreshDetail(); return; }
    const { v } = tickValues(ev, status(ev, now), now);
    v.forEach((x, i) => {
      const b = $(`[data-t="${i}"]`, sheet), l = $(`[data-tl="${i}"]`, sheet);
      if (b && b.textContent !== fmt(x)) b.textContent = fmt(x);
      if (l) l.textContent = TICK_NAMES[i][x === 1 ? 0 : 1];
    });
  }

  function confetti(host) {
    if (reduceMotion || !host) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    host.appendChild(cv);
    const r = host.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--c-rogn', '--c-raud', '--c-gran', '--c-fjord', '--c-lyng'].map(v => css.getPropertyValue(v).trim()).concat(['#FFD23F', '#FFFFFF']);
    const P = Array.from({ length: 110 }, () => ({
      x: r.width / 2 + (Math.random() - 0.5) * 80, y: r.height * 0.55,
      vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 10 - 4,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.35,
      c: cols[(Math.random() * cols.length) | 0],
    }));
    const t0 = performance.now();
    (function frame(t) {
      const k = (t - t0) / 1000;
      ctx.clearRect(0, 0, r.width, r.height);
      ctx.globalAlpha = Math.max(0, 1 - k / 2.8);
      for (const p of P) {
        p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
      if (k < 2.8 && cv.isConnected) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // ---------- Skjema ----------
  function openForm(init = {}) {
    const today = dateOnly(new Date());
    F = {
      id: init.id || null,
      kind: init.kind === 'up' ? 'up' : 'down',
      title: init.title || '',
      placeholder: init.placeholder || (init.kind === 'up' ? 'Til dømes «Hunden kom i hus»' : 'Til dømes «Bursdag til Emma»'),
      date: init.date || (init.rule ? ymd(firstOcc({ rule: init.rule }, today)) : ''),
      time: init.time || '',
      unit: init.rule ? 'year' : (init.repeat && UNIT_NAMES[init.repeat.unit] ? init.repeat.unit : 'none'),
      every: (init.repeat && init.repeat.every) || 1,
      showAge: !!init.showAge,
      rule: init.rule || null,
      color: COLORS.includes(init.color) ? init.color : 'rogn',
      template: init.template || null,
      photo: normPhoto(init.photo),
      created: init.created || Date.now(),
      ownFile: null, ownPreview: null, busy: false,
    };
    const p = F.photo;
    F.pick = !p ? 'none' : p.art ? 'art:' + p.art : 'keep';

    showLayer(formHTML(), 'form');

  function formHTML() {
    const editing = !!F.id;
    return `<form class="form" id="evForm" novalidate>`
      + `<div class="form-head"><h2 id="sheetTitle">${editing ? 'Endre nedteljing' : 'Ny nedteljing'}</h2><button type="button" class="x plain" data-close aria-label="Lukk">${ICON.x}</button></div>`
      + `<div class="seg" role="group" aria-label="Kva skal teljast"><button type="button" data-kind="down">Tel ned til ein dag</button><button type="button" data-kind="up">Tel dagar sidan</button></div>`
      + `<label class="field"><span>Namn</span><input class="input" id="fTitle" maxlength="60" autocomplete="off" value="${esc(F.title)}" placeholder="${esc(F.placeholder)}"></label>`
      + `<div class="row2" id="dateRow"><label class="field"><span id="fDateLabel">Dato</span><input class="input" id="fDate" type="date" value="${esc(F.date)}"></label>`
      + `<label class="field"><span>Klokka <em>(valfritt)</em></span><input class="input" id="fTime" type="time" value="${esc(F.time)}"></label></div>`
      + `<p class="hint" id="ageHint">Skriv inn fødselsdatoen med rett årstal, så reknar appen ut alderen.</p>`
      + `<div class="rule-note" id="ruleNote"><span id="ruleText"></span><button type="button" class="linkbtn" id="ruleClear">Bruk ein fast dato i staden</button></div>`
      + `<fieldset class="field" id="repeatSet"><legend>Gjenta nedteljinga</legend>`
      + `<div class="seg" role="group" aria-label="Gjenta">${[['none', 'Aldri'], ['week', 'Veke'], ['month', 'Månad'], ['year', 'År']].map(([v, l]) => `<button type="button" data-unit="${v}">${l}</button>`).join('')}</div>`
      + `<div id="everyRow"><div class="every"><span>Kvar</span><input class="input" id="fEvery" type="number" inputmode="numeric" min="1" max="99" value="${F.every}" aria-label="Kor ofte"><span id="everyUnit"></span></div><p class="hint" id="everyHint"></p></div>`
      + `<label class="check" id="ageRow"><input type="checkbox" id="fAge"${F.showAge ? ' checked' : ''}><span>Vis alder, til dømes «fyller 10 år»</span></label>`
      + `</fieldset>`
      + `<fieldset class="field"><legend>Farge</legend><div class="swatches">${COLORS.map(c => `<label class="sw" style="--band:var(--c-${c})"><input type="radio" name="fColor" value="${c}"${F.color === c ? ' checked' : ''} aria-label="${COLOR_NAMES[c]}"><span></span></label>`).join('')}</div></fieldset>`
      + `<div class="field"><span>Bilete</span><div class="art-grid" id="artGrid">${artGridHTML()}</div>`
      + `<div class="photo-pick"><label class="btn"><input type="file" accept="image/*" id="fPhoto" class="sr">${ICON.image}<span>Bruk eige bilete</span></label></div></div>`
      + `<p class="form-err" id="formErr" role="alert"></p>`
      + `<div class="form-foot"><button type="button" class="btn" data-close>Avbryt</button><button type="submit" class="btn btn-primary" id="saveBtn">${editing ? 'Lagre endringane' : 'Legg til'}</button></div>`
      + `</form>`;
  }
  // Rutenett med «Ingen», eige bilete (om det finst) og dei ferdige illustrasjonane.
  function artGridHTML() {
    const ownSrc = F.ownPreview || photoSrc(F.photo);
    const own = F.pick === 'file' || F.pick === 'keep';
    return `<button type="button" class="art-opt none" data-art="" aria-pressed="${F.pick === 'none'}">Ingen</button>`
      + (ownSrc ? `<button type="button" class="art-opt" data-art="own" aria-pressed="${own}" aria-label="Eige bilete" title="Eige bilete"><img class="thumb" src="${esc(ownSrc)}" alt=""></button>` : '')
      + ARTS.map(([k, l]) => `<button type="button" class="art-opt" data-art="${k}" aria-pressed="${F.pick === 'art:' + k}" aria-label="${l}" title="${l}">${artSVG(k)}</button>`).join('');
  }
  const redrawArt = () => { const g = $('#artGrid', layer); if (g) g.innerHTML = artGridHTML(); };
  function syncForm() {
    if (!F) return;
    const today = dateOnly(new Date());
    $$('[data-kind]', layer).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === F.kind)));
    $$('[data-unit]', layer).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === F.unit)));
    const ruleOn = !!F.rule && F.kind === 'down';
    $('#ruleNote', layer).hidden = !ruleOn;
    $('#dateRow', layer).hidden = ruleOn;
    if (ruleOn) $('#ruleText', layer).textContent = `Datoen følgjer regelen «${ruleText(F.rule)}». Neste gong er ${dateLabel(firstOcc({ rule: F.rule }, today), today, true)}.`;
    $('#repeatSet', layer).hidden = F.kind !== 'down' || ruleOn;
    $('#everyRow', layer).hidden = F.unit === 'none';
    $('#everyUnit', layer).textContent = '. ' + (UNIT_NAMES[F.unit] || '');

  function formErr(msg, focusSel) {
    const el = $('#formErr', layer);

  async function submitForm() {
    if (!F || F.busy) return;
    const title = F.title.trim();
    const ruleOn = !!F.rule && F.kind === 'down';
    if (!title) return formErr('Skriv eit namn, til dømes «Bursdag til Emma».', '#fTitle');
    if (!ruleOn && !parseYmd(F.date)) return formErr('Vel ein dato.', '#fDate');
    const btn = $('#saveBtn', layer);
    F.busy = true; btn.disabled = true; btn.textContent = 'Lagrar …'; formErr('');
    const form = F;
    try {
      let photo = null;
      if (form.pick.startsWith('art:')) photo = { art: form.pick.slice(4) };
      else if (form.pick === 'keep') photo = form.photo;
      else if (form.pick === 'file' && form.ownFile) photo = await persistPhoto(form.ownFile);
      const today = dateOnly(new Date());
      const doc = {
        title,
        kind: form.kind,
        date: ruleOn ? ymd(firstOcc({ rule: form.rule }, today)) : form.date,
        time: form.time || '',
        repeat: form.kind === 'down' ? { unit: ruleOn ? 'year' : form.unit, every: ruleOn ? 1 : Math.min(99, Math.max(1, form.every | 0 || 1)) } : { unit: 'none', every: 1 },
        rule: ruleOn ? form.rule : null,
        color: form.color,
        photo: photo || null,
        showAge: form.kind === 'down' && !ruleOn && form.unit === 'year' && form.showAge,
        template: form.template,
        created: form.created,
        updated: Date.now(),
      };
      const id = form.id || 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const old = form.id ? S.events.find(e => e.id === form.id) : null;
      await Store.put(id, doc);
      if (old && old.photo && old.photo.asset && (!photo || photo.asset !== old.photo.asset)) dropAsset(old.photo.asset);
      if (old && old.photo && old.photo.cloud && (!photo || photo.cloud !== old.photo.cloud)) dropCloud(old.photo.cloud);
      if (F !== form) return;
      closeLayer();
      toast(form.id ? 'Endringane er lagra' : 'Lagt til');
    } catch (e) {
      if (e && e.code === 'invalid_argument' && S.mode === 'db') { S.canWrite = false; render(); }
      if (F !== form) return;
      form.busy = false; btn.disabled = false; btn.textContent = form.id ? 'Lagre endringane' : 'Legg til';
      formErr(errText(e));
    }
  }

  let delTimer = 0;
  async function deleteClick(btn, id) {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed');
      btn.lastElementChild.textContent = 'Trykk igjen for å slette';
      clearTimeout(delTimer);
      delTimer = setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.lastElementChild.textContent = 'Slett'; } }, 3500);
      return;
    }
    clearTimeout(delTimer);
    const ev = S.events.find(e => e.id === id);
    btn.disabled = true;
    try {
      await Store.del(id);
      if (ev && ev.photo && ev.photo.asset) dropAsset(ev.photo.asset);
      if (ev && ev.photo && ev.photo.cloud) dropCloud(ev.photo.cloud);
      closeLayer();
      toast('Sletta');
    } catch (e) {
      btn.disabled = false;
      toast(errText(e));
    }
  }

  let toastTimer = 0;

  // ---------- Konto-arket ----------
  function openAccount(tab) {

        + `<div class="form-head"><h2 id="sheetTitle">Kontoen din</h2><button type="button" class="x plain" data-close aria-label="Lukk">${ICON.x}</button></div>`
        + `<p>Du er logga inn som <b>${esc(S.acc.namn)}</b>. Logg inn med same namn og passord på PC-en og telefonen, så ser du dei same nedteljingane overalt.</p>`
        + `<p class="muted" id="syncInfo">${esc(syncText())}</p>`
        + `<div class="form-foot"><button type="button" class="btn" data-logout>Logg ut</button><button type="button" class="btn btn-primary" data-sync>Synk no</button></div>`
        + `</div>`, 'acct');
      return;
    }
    A = { tab: tab === 'ny' ? 'ny' : 'inn', busy: false, namn: A ? A.namn : '' };
    showLayer(acctFormHTML(), 'acct');
  }
  function acctFormHTML() {
    const ny = A.tab === 'ny';
    const n = S.mode === 'local' ? S.events.length : 0;
    return `<form class="acct" id="acctForm" novalidate>`
      + `<div class="form-head"><h2 id="sheetTitle">${ny ? 'Lag konto' : 'Logg inn'}</h2><button type="button" class="x plain" data-close aria-label="Lukk">${ICON.x}</button></div>`
      + `<p class="muted">Med ein konto ser du dei same nedteljingane på PC-en og telefonen. Bruk same namn og passord på alle einingane.</p>`
      + `<div class="seg" role="group" aria-label="Konto"><button type="button" data-tab="inn" aria-pressed="${!ny}">Eg har konto</button><button type="button" data-tab="ny" aria-pressed="${ny}">Lag ny konto</button></div>`
      + `<label class="field"><span>Namn</span><input class="input" id="aNamn" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" value="${esc(A.namn)}" placeholder="Til dømes lillerud"></label>`
      + `<label class="field"><span>Passord</span><input class="input" id="aPass" type="password" autocomplete="${ny ? 'new-password' : 'current-password'}" maxlength="200"></label>`
      + (ny ? `<label class="field"><span>Skriv passordet ein gong til</span><input class="input" id="aPass2" type="password" autocomplete="new-password" maxlength="200"></label>`
        + `<p class="hint">Namnet kan ha bokstavar, tal, punktum og bindestrek. Passordet må ha minst 6 teikn. Skriv det ned ein trygg stad, for det går ikkje an å få eit nytt om du gløymer det.</p>` : '')
      + (n ? `<p class="hint">${n === 1 ? 'Nedteljinga' : `Dei ${n} nedteljingane`} på denne eininga blir flytta inn på kontoen.</p>` : '')
      + `<p class="form-err" id="acctErr" role="alert"></p>`
      + `<div class="form-foot"><button type="button" class="btn" data-close>Avbryt</button><button type="submit" class="btn btn-primary" id="acctSubmit">${ny ? 'Lag konto' : 'Logg inn'}</button></div>`
      + `</form>`;
  }
  async function submitAcct() {
    if (!A || A.busy) return;
    const namn = $('#aNamn', layer).value.trim(), pass = $('#aPass', layer).value;
    const err = m => { $('#acctErr', layer).textContent = m; };
    if (namn.length < 3) return err('Skriv eit namn på minst 3 teikn.');
    if (pass.length < 6) return err('Passordet må ha minst 6 teikn.');
    if (A.tab === 'ny' && pass !== $('#aPass2', layer).value) return err('Dei to passorda er ikkje like.');
    const btn = $('#acctSubmit', layer), label = btn.textContent, acct = A;
    acct.busy = true; btn.disabled = true; btn.textContent = A.tab === 'ny' ? 'Lagar konto …' : 'Loggar inn …'; err('');
    try {
      const moved = await doAuth(A.tab, namn, pass);
      if (A === acct) closeLayer();
      toast(moved ? `Logga inn. ${moved} ${pl(moved, 'nedteljing', 'nedteljingar')} er flytta inn på kontoen.` : 'Logga inn');
    } catch (e) {
      if (A !== acct) return;
      acct.busy = false; btn.disabled = false; btn.textContent = label;
      err(errText(e));
    }
  }

  // ---------- Hendingar ----------
  main.addEventListener('click', e => {
    const el = e.target.closest('[data-open],[data-new],[data-login]');
    if (!el) return;
    if (el.dataset.open) openDetail(el.dataset.open);
    else if ('new' in el.dataset) openPick();
    else if ('login' in el.dataset) openAccount('inn');
  });
  $('#addBtn').addEventListener('click', () => openPick());
  $('#kontoBtn').addEventListener('click', () => openAccount('inn'));

  layer.addEventListener('click', e => {
    if (e.target === layer) { closeLayer(); return; }
    const el = e.target.closest('[data-close],[data-edit],[data-del],[data-kind],[data-unit],[data-art],[data-tab],[data-logout],[data-sync],[data-new],[data-tpl],[data-start],[data-open],#ruleClear');
    if (!el) return;
    const today = dateOnly(new Date());
    if ('close' in el.dataset) closeLayer();
    else if ('new' in el.dataset) openForm();
    else if (el.dataset.tpl) { const t = TEMPLATES.find(x => x.key === el.dataset.tpl); if (t) openForm(tplEvent(t, today)); }
    else if (el.dataset.start) { const s = STARTERS.find(x => x.key === el.dataset.start); if (s) openForm({ ...s.init(today), color: s.color, photo: { art: s.art } }); }
    else if (el.dataset.open) openDetail(el.dataset.open);
    else if (A && el.dataset.tab) { A.namn = $('#aNamn', layer).value; A.tab = el.dataset.tab; layer.firstElementChild.innerHTML = acctFormHTML(); $('#aNamn', layer).focus(); }
    else if ('logout' in el.dataset) logout();
    else if ('sync' in el.dataset) {
      el.disabled = true;
      pull().then(() => { const i = $('#syncInfo', layer); if (i) i.textContent = syncText(); el.disabled = false; });
    }
    else if (F && 'art' in el.dataset) {
      const k = el.dataset.art;
      F.autoArt = false;
      F.pick = k === '' ? 'none' : k === 'own' ? (F.ownFile ? 'file' : 'keep') : 'art:' + k;
      redrawArt();
    }
    else if (el.dataset.edit) { const ev = S.events.find(x => x.id === el.dataset.edit); stopTick(); S.detailId = null; if (ev) openForm(ev); }
    else if (el.dataset.del) deleteClick(el, el.dataset.del);
    else if (F && el.dataset.kind) {
      F.kind = el.dataset.kind;
      if (F.kind === 'up' && !parseYmd(F.date)) { F.date = ymd(dateOnly(new Date())); $('#fDate', layer).value = F.date; }
      syncForm();
    }
    else if (F && el.dataset.unit) { F.unit = el.dataset.unit; syncForm(); }
    else if (F && el.id === 'ruleClear') { F.date = ymd(firstOcc({ rule: F.rule }, dateOnly(new Date()))); F.rule = null; F.unit = 'year'; $('#fDate', layer).value = F.date; syncForm(); }
  });
  layer.addEventListener('input', e => {
    if (!F) return;
    const id = e.target.id;
    if (id === 'fTitle') {
      F.title = e.target.value;
      if (F.autoArt) {
        const k = artFor(F.title), pick = k ? 'art:' + k : 'none';
        if (pick !== F.pick) { F.pick = pick; redrawArt(); }
      }
    }
    else if (id === 'fDate') F.date = e.target.value;
    else if (id === 'fTime') F.time = e.target.value;
    else if (id === 'fEvery') { F.every = parseInt(e.target.value, 10) || 1; syncForm(); }
  });
  layer.addEventListener('change', e => {
    if (!F) return;
    const t = e.target;
    if (t.id === 'fDate') F.date = t.value;
    else if (t.id === 'fTime') F.time = t.value;
    else if (t.id === 'fAge') { F.showAge = t.checked; syncForm(); }
    else if (t.name === 'fColor') F.color = t.value;
    else if (t.id === 'fPhoto' && t.files && t.files[0]) {
      const file = t.files[0];
      if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp|gif)$/i.test(file.name)) { formErr('Vel ei biletfil, til dømes JPG, PNG eller HEIC.'); return; }
      if (F.ownPreview) URL.revokeObjectURL(F.ownPreview);
      F.ownFile = file; F.ownPreview = URL.createObjectURL(file); F.pick = 'file'; F.autoArt = false;
      redrawArt();
      formErr('');
    }
  });
  layer.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'acctForm') submitAcct(); else submitForm(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !layer.hidden) closeLayer(); });
  document.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    const holder = img.closest('.has-photo');
    if (holder) holder.classList.remove('has-photo');
    if (!img.classList.contains('thumb')) img.remove();
  }, true);

  let lastKey = '';
  setInterval(() => {
    const now = new Date();
    const key = ymd(now) + (S.events.some(e => e.time) ? `${now.getHours()}:${now.getMinutes()}` : '');
    if (key !== lastKey) { lastKey = key; render(); }
  }, 15000);
  setInterval(() => { if (S.mode === 'cloud' && !document.hidden) pull(true); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    render();
    refreshDetail();
    if (S.mode === 'cloud') pull(true);
  });

  // ---------- Oppstart ----------
  function useLocal() {
    S.mode = 'local'; S.loading = false; S.canWrite = true;
    S.events = readLocal();
    render();
  }
  async function init() {
    render();
    if (CLOUD_OK) {
      const acc = readJson(ACC_KEY);
      if (!acc || !acc.token || !acc.namn) { useLocal(); return; }
      S.acc = { namn: String(acc.namn), token: String(acc.token) };
      S.mode = 'cloud';
      const cache = readJson(CLOUD_KEY);
      if (cache && cache.namn === S.acc.namn && Array.isArray(cache.events)) S.events = cache.events.map(clean).filter(Boolean);
      else S.loading = true;
      render();
      await pull(true);
      migrateLocal();
      return;
    }
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { useLocal(); return; }
    let db = null, user = null, assets = null;
    try { [db, user, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]); } catch { /* fell tilbake til lokal lagring */ }
    if (!db) { useLocal(); return; }
    S.mode = 'db';
    S.col = db.collection('events');
    S.assets = assets;
    if (user) {
      try { const w = await user.can('data.write'); S.canWrite = w !== false; } catch { /* behald skrivetilgang og la lagringa avgjere */ }
    }
    S.col.onSnapshot(snap => {
      if (snap.metadata.fromCache && snap.empty) return;
      S.events = snap.docs.map(d => clean({ id: d.id, ...d.data() })).filter(Boolean);
      S.loading = false;
      render();
      if (S.detailId) refreshDetail();
    }, () => {
      S.loading = false;
      render();
      toast('Mista kontakten med lagringa. Last sida på nytt.');
    });
    setTimeout(() => { if (S.loading) { S.loading = false; render(); } }, 8000);
  }
  init();
})();
</script>
