# Cloudflare Worker for innlogging og synk i Dagteljar (sjå worker.js).
name = "dagteljar"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Ingen logging av førespurnader (dei inneheld IP-adresser)
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "dagteljar"
database_id = "69fcca48-9820-415c-bbbb-40b778aceea9"

# Kvar eining (IP): 10 forsøk på innlogging eller ny konto i minuttet
[[ratelimits]]
name = "GRENSE"
namespace_id = "4620"

  [ratelimits.simple]
  limit = 10
  period = 60
